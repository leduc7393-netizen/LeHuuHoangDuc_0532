<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Cipher</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet"/>
    <style>
        body {
            background: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cipher-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            background: #ffffff;
            height: 100%;
        }
        .card-title-custom {
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        .btn {
            border-radius: 8px;
            font-weight: 500;
            padding: 10px 20px;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fa-solid fa-key me-2"></i>CAESAR CIPHER TOOL
            </span>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i>Trang chủ</a>
        </div>
    </nav>

    <div class="container py-3">
        <div class="row g-4">
            
            <div class="col-md-6">
                <div class="card cipher-card p-4">
                    <div class="d-flex align-items-center text-primary mb-3">
                        <i class="fa-solid fa-lock-open fa-lg me-2"></i>
                        <h5 class="card-title-custom m-0 text-uppercase">Encryption (Mã hóa)</h5>
                    </div>
                    <hr class="mt-0 mb-4">
                    
                    <form method="POST" action="/encrypt">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Plain text:</label>
                            <input type="text" class="form-control form-control-lg" name="inputPlainText" placeholder="Nhập văn bản cần mã hóa..." required autofocus/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary">Key (Bước dịch chuyển):</label>
                            <input type="number" class="form-control form-control-lg" name="inputKeyPlain" placeholder="Nhập số nguyên (ví dụ: 3)" required/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 shadow-sm">
                            <i class="fa-solid fa-gears me-2"></i>Mã hóa văn bản
                        </button>
                    </form>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card cipher-card p-4">
                    <div class="d-flex align-items-center text-success mb-3">
                        <i class="fa-solid fa-lock fa-lg me-2"></i>
                        <h5 class="card-title-custom m-0 text-uppercase">Decryption (Giải mã)</h5>
                    </div>
                    <hr class="mt-0 mb-4">
                    
                    <form method="POST" action="/decrypt">
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary">Cipher text:</label>
                            <input type="text" class="form-control form-control-lg" name="inputCipherText" placeholder="Nhập chuỗi mật mã..." required/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary">Key (Bước dịch chuyển):</label>
                            <input type="number" class="form-control form-control-lg" name="inputKeyCipher" placeholder="Nhập số nguyên tương ứng" required/>
                        </div>
                        <button type="submit" class="btn btn-success w-100 shadow-sm text-white">
                            <i class="fa-solid fa-unlock-keyhole me-2"></i>Giải mã văn bản
                        </button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
